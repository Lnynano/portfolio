<svg xmlns="http://www.w3.org/2000/svg" width="490" height="190" viewBox="0 0 490 190" role="img" aria-label="TU Shooting Scoreboard — live ISSF scoreboard. JavaScript, Supabase, GitHub Pages.">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans Thai', Helvetica, Arial, sans-serif; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <rect x="0.5" y="0.5" width="489" height="189" rx="12" fill="#0D1117" stroke="#30363D"/>
  <defs><clipPath id="c"><rect width="490" height="190" rx="12"/></clipPath></defs>
  <rect x="0" y="0" width="6" height="190" fill="#F78166" clip-path="url(#c)"/>
  <text x="28" y="38" class="mono" font-size="12" fill="#F78166">02 · TU SHOOTING CLUB</text>
  <circle class="live" cx="404" cy="34" r="5" fill="#F85149"/>
  <text x="416" y="38" class="mono" font-size="12" fill="#F85149">LIVE</text>
  <text x="28" y="72" class="sans" font-size="26" font-weight="700" fill="#F0F6FC">TU Shooting Scoreboard</text>
  <text x="28" y="100" class="sans" font-size="14" fill="#C9D1D9">Realtime ISSF results, projector board, staff</text>
  <text x="28" y="120" class="sans" font-size="14" fill="#C9D1D9">score entry, tie-breaks &amp; Excel export.</text>
  <g class="mono" font-size="11" fill="#C9D1D9">
    <rect x="28" y="142" width="96" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="76" y="158" text-anchor="middle">JavaScript</text>
    <rect x="132" y="142" width="80" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="172" y="158" text-anchor="middle">Supabase</text>
  </g>
  <text x="462" y="160" text-anchor="end" class="mono" font-size="12" fill="#F78166">shooting.lnynano.com ↗</text>
</svg>
