<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Kiktichej Sintaosathapon (Lnynano) — Computer Engineering student at Thammasat University">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans Thai', Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: in .4s ease forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; } .l6 { animation-delay: 2.3s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2230" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="14" fill="#0D1117"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#30363D"/>

  <!-- window bar -->
  <circle cx="28" cy="26" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="26" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="26" r="6" fill="#28C840"/>
  <text x="500" y="31" text-anchor="middle" class="mono" font-size="13" fill="#7D8590">lnynano@thammasat: ~</text>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#30363D"/>

  <!-- left: name -->
  <g class="line l1"><text x="40" y="96" class="mono" font-size="16" fill="#7D8590">$ whoami</text><rect class="cursor" x="128" y="82" width="9" height="18" fill="#58A6FF"/></g>
  <g class="line l2"><text x="40" y="148" class="sans" font-size="44" font-weight="700" fill="#F0F6FC">Kiktichej Sintaosathapon</text></g>
  <g class="line l3"><text x="40" y="184" class="sans" font-size="19" fill="#C9D1D9">Computer Engineering · Thammasat University</text></g>
  <g class="line l4"><text x="40" y="214" class="sans" font-size="17" fill="#8B949E">นักศึกษาวิศวกรรมคอมพิวเตอร์ มหาวิทยาลัยธรรมศาสตร์</text></g>
  <g class="line l5">
    <circle class="dot" cx="46" cy="246" r="5" fill="#3FB950"/>
    <text x="60" y="251" class="mono" font-size="14" fill="#7D8590">building practical tools for everyday problems</text>
  </g>

  <!-- right: spec block -->
  <g class="line l6 mono" font-size="14">
    <rect x="690" y="76" width="270" height="172" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="710" y="106" fill="#7D8590">handle</text><text x="800" y="106" fill="#58A6FF">@lnynano</text>
    <text x="710" y="134" fill="#7D8590">focus</text><text x="800" y="134" fill="#C9D1D9">web · data · AI</text>
    <text x="710" y="162" fill="#7D8590">stack</text><text x="800" y="162" fill="#C9D1D9">TS · Python</text>
    <text x="710" y="190" fill="#7D8590">speaks</text><text x="800" y="190" fill="#C9D1D9">ไทย / EN</text>
    <text x="710" y="218" fill="#7D8590">site</text><text x="800" y="218" fill="#58A6FF">lnynano.com</text>
  </g>
</svg>
